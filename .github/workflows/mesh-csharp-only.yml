name: C# bindings (MRMesh only)

# Generates the bindings for a subset of MeshLib (default: `source/MRMesh` only) and compiles
# the managed C# assembly from them. Mirrors what the upstream `build-test-windows.yml` does
# for C# bindings, but keeps everything in one job and trims the input set to MRMesh.
#
# Run it from the "Actions" tab -> "C# bindings (MRMesh only)" -> "Run workflow".

on:
  workflow_dispatch:
    inputs:
      only_projects:
        description: 'Generate bindings only for these source/ projects (space separated)'
        required: false
        default: 'MRMesh'
      assembly_name:
        description: 'Managed assembly name, without ".dll"'
        required: false
        default: 'MRDotNetMeshOnly'
      config:
        description: 'Build configuration'
        required: false
        type: choice
        default: 'Release'
        options:
          - Release
          - Debug
      vcpkg_version:
        description: 'vcpkg release tag (see .github/workflows/config.yml)'
        required: false
        default: '2026.07.29'

jobs:
  bindings:
    runs-on: windows-2025
    timeout-minutes: 350

    env:
      # Runner images ship MSYS2 at C:\msys64. `generate_win.bat` and `install_mrbind_*.bat`
      # default to C:\msys64_meshlib_mrbind (the local-dev copy), so it must be overridden.
      MSYS2_DIR: C:\msys64
      MSYS2_ENV: clang64
      VCPKG_ROOT: C:\vcpkg
      VCPKG_VERSION: ${{ inputs.vcpkg_version }}
      ONLY_PROJECTS: ${{ inputs.only_projects }}
      CSHARP_MODE: ${{ inputs.config }}
      ASSEMBLY_NAME: ${{ inputs.assembly_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Checkout mrbind submodule
        run: git submodule update --init --recursive --depth 1 thirdparty/mrbind

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ---------------------------------------------------------------- vcpkg
      # `thirdparty/install.bat` picks the S3 binary-cache folder from
      # `git describe --tags --exact-match`, so the checkout must be on a release tag.
      - name: Pin vcpkg to a release tag
        shell: pwsh
        run: |
          $ver = $env:VCPKG_VERSION
          Write-Host "Using vcpkg $ver"
          git -C C:\vcpkg fetch --tags --force origin
          git -C C:\vcpkg fetch --unshallow 2>&1 | Out-Null
          git -C C:\vcpkg reset --hard
          git -C C:\vcpkg clean -ffdx
          git -C C:\vcpkg checkout --force $ver
          if ($LASTEXITCODE -ne 0) { throw "Can't check out vcpkg tag '$ver'." }
          & C:\vcpkg\bootstrap-vcpkg.bat
          if ($LASTEXITCODE -ne 0) { throw 'bootstrap-vcpkg.bat failed.' }

      # VS ships its own vcpkg and puts it on PATH; `where vcpkg` inside
      # `thirdparty/install.bat` keeps the *last* match, which is that one -- not a git repo.
      - name: Put the right vcpkg on PATH
        shell: pwsh
        run: |
          $items = ($env:PATH -split ';') | Where-Object { $_ -and ($_ -notmatch '(?i)[\\/]vcpkg[\\/]?$') }
          $newPath = 'C:\vcpkg;' + ($items -join ';')
          "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PATH = $newPath
          & C:\vcpkg\vcpkg.exe integrate install
          Write-Host 'vcpkg matches on PATH (the last one is what install.bat uses):'
          where.exe vcpkg

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-${{ runner.os }}-${{ inputs.vcpkg_version }}-x64-windows-meshlib-${{ hashFiles('requirements/windows.txt') }}

      # The parser needs the vcpkg headers (boost, eigen3, jsoncpp, ...).
      - name: Install vcpkg dependencies
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%
          call .\thirdparty\install.bat || exit /b 1

      # ------------------------------------------------------------ Emscripten
      # With `TARGET=c`, `generate.mk` always sets `TARGETING_EMSCRIPTEN` (unless the host is
      # macOS), so the Emscripten SDK is required on Windows even for the native C bindings.
      # See the "c" section of `scripts/mrbind/README-generating.md`.
      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: C:\emsdk
          key: emsdk-${{ runner.os }}-4.0.10

      - name: Install Emscripten SDK
        shell: cmd
        run: |
          if not exist C:\emsdk\emsdk.bat (
            git clone --depth 1 https://github.com/emscripten-core/emsdk C:\emsdk || exit /b 1
          )
          call C:\emsdk\emsdk.bat install 4.0.10 || exit /b 1
          call C:\emsdk\emsdk.bat activate 4.0.10 || exit /b 1

      # ------------------------------------------------------- MSYS2 + MRBind
      # These are the same composite actions the upstream CI uses: they install the pinned
      # Clang packages into C:\msys64 and cache the MRBind binaries.
      - name: Install MSYS2 for MRBind
        uses: ./.github/actions/install-msys2-mrbind
        with:
          packages-suffix: _clang22

      - name: Build MRBind
        uses: ./.github/actions/build-mrbind
        with:
          cache-key-prefix: windows-clang22
          build-script: scripts/mrbind/install_mrbind_windows_msys2.bat
          extra-cache-key: ${{ hashFiles('scripts/mrbind/msys2_package_hashes_clang22.txt') }}
          msys2-env: clang64

      # -------------------------------------------------------- generate.mk
      # Adds the `ONLY_PROJECTS=...` switch, so no source file has to be committed.
      # Idempotent: skipped if `generate.mk` is already patched (e.g. committed to the repo).
      - name: Patch generate.mk (MRMesh-only switch)
        shell: pwsh
        run: |
          $path = 'scripts/mrbind/generate.mk'
          $mk = Get-Content -Raw -LiteralPath $path

          if ($mk -notmatch 'ONLY_PROJECTS') {
            Write-Host 'Patching generate.mk...'

            # Preserve the original line endings.
            $nl = if ($mk.Contains("`r`n")) { "`r`n" } else { "`n" }

            $block = @(
              'mrcuda_PyDependsOn := $(PACKAGE_NAME).mrmeshpy',
              '',
              '',
              '# Optional: restrict the bindings to a subset of the `source/` projects listed above.',
              '# Example: `ONLY_PROJECTS=MRMesh` generates the bindings from `source/MRMesh/` only,',
              '#   dropping `MRIOExtras`, `MRSymbolMesh`, `MRVoxels`, `MRCuda` (and the `mrcuda` module).',
              '# The `*_ExtraInputDirs` are always kept. Empty by default, meaning "everything".',
              'ifneq ($(ONLY_PROJECTS),)',
              '# Drop the modules that have no projects left after the filtering.',
              'override MODULES := $(foreach m,$(MODULES),$(if $(filter $(ONLY_PROJECTS),$($m_InputProjects)),$m))',
              '$(info Only these projects: $(ONLY_PROJECTS); only these modules: $(MODULES))',
              'endif'
            ) -join $nl

            $mk = $mk.Replace('mrcuda_PyDependsOn := $(PACKAGE_NAME).mrmeshpy', $block)

            $mk = $mk.Replace(
              '$(call var,$1__InputDirs := $(addprefix $(makefile_dir)../../source/,$($1_InputProjects)) $($1_ExtraInputDirs))',
              '$(call var,$1__InputDirs := $(addprefix $(makefile_dir)../../source/,$(if $(ONLY_PROJECTS),$(filter $(ONLY_PROJECTS),$($1_InputProjects)),$($1_InputProjects))) $($1_ExtraInputDirs))'
            )

            # Allow overriding the file-level whitelist from the environment.
            $mk = $mk.Replace('INPUT_FILES_WHITELIST := %', 'INPUT_FILES_WHITELIST ?= %')

            Set-Content -LiteralPath $path -Value $mk -NoNewline -Encoding utf8NoBOM
          }
          else {
            Write-Host 'generate.mk already supports ONLY_PROJECTS, nothing to do.'
          }

          Select-String -LiteralPath $path -Pattern 'ONLY_PROJECTS'

      # ------------------------------------------------------- generate C / C#
      - name: Generate C bindings
        shell: cmd
        run: |
          call C:\emsdk\emsdk_env.bat
          where em++ || exit /b 1
          cd /d "%GITHUB_WORKSPACE%"
          call .\scripts\mrbind\generate_win.bat -B TARGET=c || exit /b 1

      # The Cuda bindings are no longer generated (the `mrcuda` module is filtered out), but
      # CMakeLists.txt unconditionally adds this project. Use the upstream placeholder so the
      # native build still configures.
      - name: Stub out the Cuda bindings project
        shell: pwsh
        run: |
          Copy-Item scripts/mrbind/cuda_placeholder_generated_c/include source/MeshLibC2Cuda -Recurse -Force
          Copy-Item scripts/mrbind/cuda_placeholder_generated_c/src source/MeshLibC2Cuda -Recurse -Force

      - name: Generate C# sources
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          call .\scripts\mrbind\generate_win.bat -B TARGET=csharp CSHARP_MODE=%CSHARP_MODE% || exit /b 1

      - name: Build managed assembly
        shell: pwsh
        run: |
          dotnet build source/MRDotNet2 -c $env:CSHARP_MODE -p:AssemblyName=$env:ASSEMBLY_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # `generate.mk` already built the default-named assembly; drop it so the artifact
          # only carries the renamed one.
          if ($env:ASSEMBLY_NAME -ne 'MRDotNet2') {
            Remove-Item "source/x64/$env:CSHARP_MODE/MRDotNet2.*" -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meshlib-mrmesh-csharp
          if-no-files-found: error
          path: |
            source/MeshLibC2/include/**
            source/MeshLibC2/src/**
            source/MeshLibC2/temp/interop_desc.json
            source/MeshLibC2Cuda/include/**
            source/MeshLibC2Cuda/src/**
            source/MRDotNet2/MRDotNet2.csproj
            source/MRDotNet2/src/**
            source/x64/${{ inputs.config }}/*.dll
            source/x64/${{ inputs.config }}/*.xml

      - name: Report
        shell: pwsh
        run: |
          Write-Host 'Generated C binding projects:'
          Get-ChildItem source/MeshLibC2/src -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  - $($_.Name)" }

          Write-Host ''
          Write-Host 'Managed assemblies:'
          Get-ChildItem "source/x64/$env:CSHARP_MODE" -Filter *.dll -ErrorAction SilentlyContinue |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length / 1MB, 2)}} |
            Format-Table | Out-String | Write-Host
